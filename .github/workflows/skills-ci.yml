name: Skills CI

on:
  pull_request:
    paths:
      - ".github/workflows/skills-ci.yml"
      - "Makefile"
      - "skills/**"
      - "grok/skills/**"
      - "pi/skills/**"
      - "cli/skills/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/skills-ci.yml"
      - "Makefile"
      - "skills/**"
      - "grok/skills/**"
      - "pi/skills/**"
      - "cli/skills/**"

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: node --test skills/build.test.mjs

      - run: make skills-check
