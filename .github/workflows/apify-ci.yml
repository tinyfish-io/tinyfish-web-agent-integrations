name: Apify CI

on:
  pull_request:
    paths:
      - ".github/workflows/apify-ci.yml"
      - "apify/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apify-ci.yml"
      - "apify/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apify

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apify/package-lock.json

      - run: npm ci

      # Also checks that the generated .actor schemas are up to date.
      - name: Build, test, and typecheck
        run: npm run verify
