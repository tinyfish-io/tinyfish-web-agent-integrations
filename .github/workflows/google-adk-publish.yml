name: Google ADK CD - Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    if: startsWith(github.ref_name, 'google-adk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Validate tag matches pyproject.toml version
        working-directory: ./google-adk
        run: |
          TAG="${GITHUB_REF_NAME#google-adk-}"
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version 'v${VERSION}'"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pyproject.toml version ${VERSION}"

      - name: Build package
        working-directory: ./google-adk
        run: uv build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: google-adk/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
