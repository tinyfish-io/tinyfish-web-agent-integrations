[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-tinyfish"
version = "0.1.0"
description = "Official TinyFish tools for CrewAI — Search, Fetch, Agent, and Browser web infrastructure for AI agents."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "TinyFish", email = "support@tinyfish.io" }]
keywords = ["crewai", "crewai-tools", "tinyfish", "web-agent", "search", "fetch", "browser-automation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "crewai>=0.100.0",
    "pydantic>=2.4.2",
]

[project.optional-dependencies]
# TinyFish SDK is an optional extra so the base install stays light (lazy imports).
tinyfish = ["tinyfish>=0.2.5"]
# Direct browser control over the CDP url returned by TinyFishBrowserSessionTool.
browser = ["playwright>=1.40.0"]
dev = [
    "tinyfish>=0.2.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://www.tinyfish.ai"
Documentation = "https://docs.tinyfish.ai"
Repository = "https://github.com/tinyfish-io/tinyfish-web-agent-integrations"
"TinyFish API Keys" = "https://agent.tinyfish.ai/api-keys"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_tinyfish"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "T201", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
